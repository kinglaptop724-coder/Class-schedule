<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Scheduler | ระบบจัดตารางสอน</title>
<meta name="theme-color" content="#0b3d91">
<meta name="description" content="ระบบช่วยจัดตารางสอน โรงเรียนอนุบาลชุมชนหนองบัวแดง">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ตารางสอน">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#0b3d91;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;
       padding-top:env(safe-area-inset-top);box-sizing:border-box;background-clip:content-box}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:18px;background:linear-gradient(135deg,#3b9bff,#0057c2);color:#fff;
          font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;transition:opacity .4s}
  #splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  #splash .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
  #splash p{margin:0;font-size:15px;opacity:.9}
  #splash a{color:#fff;text-decoration:underline}
  #hint{display:none}
  @keyframes s{to{transform:rotate(360deg)}}
  #install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;display:none;
           align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;color:#0f172a;
           box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;
           max-width:460px;margin:0 auto;animation:up .35s ease}
  #install img{width:48px;height:48px;border-radius:12px;flex:none}
  #install .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
  #install .t b{display:block;font-size:15px}
  #install .t span{color:#475569;font-size:13px}
  #install button{border:0;border-radius:12px;padding:10px 16px;font:600 14px system-ui,sans-serif;cursor:pointer}
  #install .go{background:linear-gradient(135deg,#3b9bff,#0057c2);color:#fff}
  #install .no{background:transparent;color:#64748b;padding:10px 8px}
  #ios{position:fixed;inset:0;z-index:11;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);
       font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif}
  #ios .card{background:#fff;color:#0f172a;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .3s ease}
  #ios h3{margin:0 0 10px;font-size:17px} #ios ol{margin:0 0 14px;padding-left:20px;line-height:1.8;font-size:15px}
  #ios button{width:100%;border:0;border-radius:12px;padding:12px;background:#0b3d91;color:#fff;font:600 15px system-ui,sans-serif}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <div class="spin"></div>
  <p>กำลังโหลดระบบจัดตารางสอน...</p>
  <p id="hint">โหลดนานกว่าปกติ <a href="#" id="retry">ลองใหม่</a> หรือ <a href="#" id="direct">เปิดโดยตรง</a></p>
</div>
<iframe id="app" title="ระบบจัดตารางสอน" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="install">
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b>ติดตั้งแอปตารางสอน</b><span id="install-sub">เปิดใช้งานได้จากหน้าจอหลัก เหมือนแอปทั่วไป</span></div>
  <button class="go" id="install-go">ติดตั้ง</button>
  <button class="no" id="install-no" aria-label="ปิด">ภายหลัง</button>
</div>
<div id="ios"><div class="card">
  <h3>ติดตั้งบน iPhone / iPad</h3>
  <ol><li>แตะปุ่ม <b>แชร์</b> (สี่เหลี่ยมมีลูกศรขึ้น) ที่แถบล่างของ Safari</li>
      <li>เลื่อนหาแล้วแตะ <b>เพิ่มไปยังหน้าจอโฮม</b></li>
      <li>แตะ <b>เพิ่ม</b> ที่มุมขวาบน</li></ol>
  <button id="ios-ok">เข้าใจแล้ว</button>
</div></div>

<script>
/* ===== ตั้งค่าเพียงจุดเดียว =====
   ใส่ URL ของ Web App จาก Apps Script (Deploy → Web app) ที่ลงท้ายด้วย /exec
   หน้าตาและโค้ดทั้งหมดอยู่ใน Apps Script — แก้ที่นั่นแล้วที่นี่อัปเดตตามอัตโนมัติ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyD6AcfsOANx1zrg-MC_YJwDu7I4ZI84BnFLtFqb-HNdBq_q0nuJv1Z6znMPnmCqO4LGQ/exec';

const frame = document.getElementById('app');
const splash = document.getElementById('splash');
const hint = document.getElementById('hint');
let timer;

function load() {
  splash.style.display = 'flex'; splash.style.opacity = 1; hint.style.display = 'none';
  clearTimeout(timer);
  timer = setTimeout(() => hint.style.display = 'block', 12000);
  frame.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
}
frame.addEventListener('load', () => {
  clearTimeout(timer);
  splash.style.opacity = 0;
  setTimeout(() => splash.style.display = 'none', 400);
});
document.getElementById('retry').onclick = e => { e.preventDefault(); load(); };
document.getElementById('direct').onclick = e => { e.preventDefault(); location.href = APPS_SCRIPT_URL; };

if (!/^https:\/\/script\.google\.com\//.test(APPS_SCRIPT_URL)) {
  document.querySelector('#splash p').innerHTML = 'ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL ใน index.html';
  document.querySelector('.spin').style.display = 'none';
} else {
  load();
}

/* ===== ถามติดตั้งแอป ===== */
(function () {
  const bar = document.getElementById('install');
  const ios = document.getElementById('ios');
  const KEY = 'installDismissedAt';
  const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferred = null;

  const dismissed = () => { try { const t = +localStorage.getItem(KEY); return t && Date.now() - t < 7 * 864e5; } catch (e) { return false; } };
  const remember = () => { try { localStorage.setItem(KEY, Date.now()); } catch (e) {} };
  const show = () => { if (!isStandalone && !dismissed()) setTimeout(() => bar.style.display = 'flex', 1500); };

  if (isStandalone) return;

  // Android / Chrome / Edge: ใช้พรอมต์ติดตั้งของเบราว์เซอร์
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; show(); });
  window.addEventListener('appinstalled', () => { bar.style.display = 'none'; deferred = null; });

  // iOS Safari: ไม่มีพรอมต์อัตโนมัติ แสดงวิธีติดตั้งแทน
  if (isIOS) { document.getElementById('install-sub').textContent = 'แตะ "ติดตั้ง" เพื่อดูวิธีเพิ่มลงหน้าจอโฮม'; show(); }

  document.getElementById('install-go').onclick = async () => {
    if (deferred) {
      deferred.prompt();
      await deferred.userChoice.catch(() => {});
      deferred = null; bar.style.display = 'none';
    } else if (isIOS) { ios.style.display = 'flex'; }
  };
  document.getElementById('install-no').onclick = () => { bar.style.display = 'none'; remember(); };
  document.getElementById('ios-ok').onclick = () => { ios.style.display = 'none'; bar.style.display = 'none'; remember(); };
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
